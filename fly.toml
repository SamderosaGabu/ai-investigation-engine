# fly.toml app configuration file generated for ai-investigation-engine on 2026-10-29T10:26:10Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ai-investigation-engine'
primary_region = 'fra'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '2gb'
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-1x'
